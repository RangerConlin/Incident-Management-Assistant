services:
  app:
    build:
      context: ..
      dockerfile: cloud_server/Dockerfile
    restart: unless-stopped
    environment:
      SARAPP_MONGO_URI: mongodb://mongo:27017
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-sarapp-cloud-server-db}
      SARAPP_CONNECT_CODE: ${SARAPP_CONNECT_CODE:?set SARAPP_CONNECT_CODE}
      SARAPP_SERVER_NAME: ${SARAPP_SERVER_NAME:-SARApp Cloud Server DB}
      SARAPP_SERVER_ID: ${SARAPP_SERVER_ID:-sarapp-cloud-server-db-${SARAPP_CONNECT_CODE}}
      SARAPP_CLOUD_ROUTER_URL: ${SARAPP_CLOUD_ROUTER_URL:-}
      SARAPP_CLOUD_ROUTER_TOKEN: ${SARAPP_CLOUD_ROUTER_TOKEN:-}
      CLOUD_ADMIN_USERNAME: ${CLOUD_ADMIN_USERNAME:-admin}
      CLOUD_ADMIN_PASSWORD: ${CLOUD_ADMIN_PASSWORD:?set CLOUD_ADMIN_PASSWORD}
      CLOUD_SESSION_SECRET: ${CLOUD_SESSION_SECRET:?set CLOUD_SESSION_SECRET}
      CLOUD_BACKUP_DIR: /var/lib/sarapp/backups
      CLOUD_CONFIG_DIR: /var/lib/sarapp/config
      SARAPP_FIREBASE_CREDENTIALS_PATH: /var/lib/sarapp/config/firebase_credentials.json
      CLOUD_UPDATE_COMMAND: ${CLOUD_UPDATE_COMMAND:-}
    volumes:
      - backups:/var/lib/sarapp/backups
      - config:/var/lib/sarapp/config
      # Required only when CLOUD_UPDATE_COMMAND runs git/docker updates from the dashboard.
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/deploy/sarapp-cloud-server-db
    depends_on:
      - mongo
    labels:
      - traefik.enable=${TRAEFIK_DIRECT_ENABLE:-false}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-sarapp-cloud-server-db}.rule=PathPrefix(`/r/${SARAPP_CONNECT_CODE}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-sarapp-cloud-server-db}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-sarapp-cloud-server-db}.tls=true
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-sarapp-cloud-server-db}.loadbalancer.server.port=8000
    networks:
      - traefik
      - internal

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - internal

volumes:
  mongo-data:
  backups:
  config:

networks:
  internal:
    internal: true
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

