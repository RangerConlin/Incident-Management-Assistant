# Same packaging style as cloud_server/docker-compose.yml and
# cloud_router's own compose file (Traefik labels, env-var-driven routing,
# external traefik network) — standalone, no shared files/images with
# either of those. This container is a plain static site: no database, no
# connect code, no SARAPP_* server env vars. Which incident/server it talks
# to is set client-side, in the browser, via the app's own /connection
# screen (src/api/connection.ts) — not at deploy time here.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-sarapp-web-client}.rule=${SARAPP_WEB_CLIENT_ROUTE_RULE:-PathPrefix(`/app`)}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-sarapp-web-client}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-sarapp-web-client}.tls=true
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-sarapp-web-client}.loadbalancer.server.port=80
    networks:
      - traefik

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
