[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sarapp-db"
version = "0.1.4"
description = "Shared MongoDB database framework for SARApp servers"
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.6",
    "pydantic>=2.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "python-dateutil>=2.8",
    "firebase-admin>=6.5",
    "httpx>=0.27.0",
    "pypdf>=6.0",
    "reportlab>=4.0",
]

[tool.setuptools]
package-dir = {"" = "sarapp_db"}

[tool.setuptools.packages.find]
where = ["sarapp_db"]
include = ["sarapp_db*"]

[tool.setuptools.package-data]
"*" = ["form_exports/assets/*.pdf", "form_exports/assets/*.json"]
