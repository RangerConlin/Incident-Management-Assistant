services:
  sarapp-cloud:
    build:
      # Repo root, not this directory — the image also vendors
      # data/db/sarapp_db so the embedded central master database can reuse
      # the existing master-catalog routers. See cloud_router/Dockerfile.
      context: ..
      dockerfile: cloud_router/Dockerfile
    container_name: sarapp-cloud
    restart: unless-stopped
    ports:
      # Direct host port remains useful for local diagnostics. Public
      # production access is expected to come through Traefik below.
      - "8765:8765"
    labels:
      - traefik.enable=true
      - traefik.http.routers.sarapp-cloud-router.rule=Host(`${SARAPP_CLOUD_ROUTER_HOST:?SARAPP_CLOUD_ROUTER_HOST must be set}`)
      - traefik.http.routers.sarapp-cloud-router.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.sarapp-cloud-router.tls=${TRAEFIK_TLS:-true}
      - traefik.http.routers.sarapp-cloud-router.service=sarapp-cloud-router
      - traefik.http.services.sarapp-cloud-router.loadbalancer.server.port=8765
    environment:
      - SARAPP_CLOUD_ROUTER_TOKEN=${SARAPP_CLOUD_ROUTER_TOKEN:?SARAPP_CLOUD_ROUTER_TOKEN must be set}
      - SARAPP_SERVER_NAME=${SARAPP_SERVER_NAME:-SARApp Cloud Router}
      - SARAPP_ROUTER_REQUEST_TIMEOUT_SECONDS=${SARAPP_ROUTER_REQUEST_TIMEOUT_SECONDS:-30}
      - SARAPP_ROUTER_HEARTBEAT_INTERVAL_SECONDS=${SARAPP_ROUTER_HEARTBEAT_INTERVAL_SECONDS:-15}
      - SARAPP_ROUTER_HEARTBEAT_TIMEOUT_SECONDS=${SARAPP_ROUTER_HEARTBEAT_TIMEOUT_SECONDS:-45}
      - SARAPP_ROUTER_MAX_PENDING_REQUESTS=${SARAPP_ROUTER_MAX_PENDING_REQUESTS:-200}
      - SARAPP_ROUTER_MAX_WS_CHANNELS=${SARAPP_ROUTER_MAX_WS_CHANNELS:-100}
      - SARAPP_ROUTER_MAX_BODY_BYTES=${SARAPP_ROUTER_MAX_BODY_BYTES:-20971520}
      - SARAPP_ROUTER_REGISTER_RATE_LIMIT=${SARAPP_ROUTER_REGISTER_RATE_LIMIT:-10}
      - CENTRAL_MASTER_ADMIN_USERNAME=${CENTRAL_MASTER_ADMIN_USERNAME:-admin}
      - CENTRAL_MASTER_ADMIN_PASSWORD=${CENTRAL_MASTER_ADMIN_PASSWORD:-change-me}
      - CENTRAL_MASTER_ADMIN_PASSWORD_SHA256=${CENTRAL_MASTER_ADMIN_PASSWORD_SHA256:-}
      - CENTRAL_MASTER_SESSION_SECRET=${CENTRAL_MASTER_SESSION_SECRET:?CENTRAL_MASTER_SESSION_SECRET must be set}
      # Embedded central master-catalog database (optional). Leave unset to
      # run cloud_router as a plain stateless proxy with no database, as
      # before. See Design Documents/Instructions/cloud_router_architecture.md.
      - SARAPP_CLOUD_ROUTER_MONGO_URI=${SARAPP_CLOUD_ROUTER_MONGO_URI:-mongodb://mongo:27017}
    depends_on:
      - mongo
    networks:
      - sarapp-net

  mongo:
    image: mongo:7
    container_name: sarapp-cloud-router-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - sarapp-net

volumes:
  mongo-data:

networks:
  sarapp-net:
